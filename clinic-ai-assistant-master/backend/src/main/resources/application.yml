server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:file:./data/clinicdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: claude-sonnet-4-6
  base-url: https://api.anthropic.com/v1/messages
  version: 2023-06-01

cors:
  allowed-origin: http://localhost:4200

logging:
  level:
    com.clinic.aiassistant: INFO